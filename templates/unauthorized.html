<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - CleverTap Unsubscribe Flow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            background: white;
            padding: 48px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
        }

        .message {
            font-size: 14px;
            color: #718096;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .email {
            background: #f7fafc;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            color: #2d3748;
            margin: 16px 0;
            font-size: 13px;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="icon">🔒</div>
        <h1 class="title">Access Denied</h1>
        <p class="message">Your email address is not authorized to access this application.</p>

        {% if email %}
        <div class="email">{{ email }}</div>
        {% endif %}

        <p class="message">Please contact your administrator if you believe this is an error.</p>

        <a href="/logout" class="button">Sign Out</a>

        <div class="footer">
            <p>CleverTap Unsubscribe Flow</p>
        </div>
    </div>
</body>
</html>
