<!DOCTYPE html>
<html>
<head>
    <title>CleverTap Unsubscribe</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .header-right { text-align: right; }
        .logout-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
        .content { padding: 30px; }
        .card { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #667eea; }
        .btn { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .btn:hover { background: #5568d3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 12px; border-radius: 6px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div><h1>🚀 CleverTap Unsubscribe</h1></div>
            <div class="header-right">
                <div style="opacity: 0.9; margin-bottom: 10px;">{{ email }}</div>
                <a href="/logout" class="logout-btn">Sign Out</a>
            </div>
        </div>

        <div class="content">
            <div class="card">
                <h2>Manual Trigger</h2>
                <p>Process all pending unsubscribe requests immediately:</p>
                <button class="btn" id="processBtn" onclick="processNow()">Process Now</button>
                <div id="status"></div>
            </div>

            <div class="card">
                <h2>Recent Activity</h2>
                <p>Processing logs will appear here</p>
            </div>
        </div>
    </div>

    <script>
        function processNow() {
            const btn = document.getElementById('processBtn');
            const statusDiv = document.getElementById('status');

            btn.disabled = true;
            btn.textContent = 'Processing...';
            statusDiv.innerHTML = '';

            fetch('/api/trigger', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    statusDiv.innerHTML = '<div class="status success">✓ ' + (data.message || 'Processing complete') + '</div>';
                    btn.disabled = false;
                    btn.textContent = 'Process Now';
                    setTimeout(() => location.reload(), 2000);
                })
                .catch(e => {
                    statusDiv.innerHTML = '<div class="status error">✗ Error: ' + e.message + '</div>';
                    btn.disabled = false;
                    btn.textContent = 'Process Now';
                });
        }
    </script>
</body>
</html>
