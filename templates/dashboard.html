<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - CleverTap Unsubscribe Flow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin: 0;
        }
        .user-info {
            text-align: right;
        }
        .user-info p {
            margin: 5px 0;
            color: #666;
        }
        .logout-btn {
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .logout-btn:hover {
            background: #c82333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dashboard</h1>
            <div class="user-info">
                <p>Welcome, <strong>{{ user.name }}</strong></p>
                <p>{{ user.email }}</p>
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </div>
        
        <div class="message">
            ✅ OAuth login working! Step 1 complete.
        </div>
        
        <p>Next: We'll add Google Sheets integration and CleverTap functionality.</p>
    </div>
</body>
</html>
